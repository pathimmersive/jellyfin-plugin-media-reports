# Builds, tests and load-checks every pull request to main and every push to main.
# Both jobs are required checks on main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: bash scripts/check-repo-docs.sh

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Loads the plugin into Jellyfin 12.0, 12.1 and 12.2 containers on the runner's Docker.
      - run: bash scripts/smoke-load.sh
      # Plays a generated movie on Jellyfin 12 with a forced transcode and checks the
      # playbacks the plugin serves during playback and after the stop.
      - run: bash scripts/smoke-playback.sh
      # Migrates, anonymises, purges, copies and exports report storage on Jellyfin 12.
      - run: bash scripts/smoke-storage.sh
      # Files reports through the report API as two users and checks every refusal.
      - run: bash scripts/smoke-report.sh
      # Works issues through the admin issues API: access, grouping, status rules, Refresh and Scan.
      - run: bash scripts/smoke-admin.sh
      # Drives Jellyfin Web in headless Chromium and checks where the Report button appears.
      - name: Install Playwright for the web smoke
        run: |
          python3 -m venv artifacts/playwright
          artifacts/playwright/bin/pip install --quiet playwright==1.64.1
          artifacts/playwright/bin/python -m playwright install --with-deps chromium
      - run: bash scripts/smoke-web.sh
        env:
          SMOKE_PYTHON: artifacts/playwright/bin/python
      # Drives the Media Reports page in the Dashboard as the admin, at 1280 and 390 px.
      - run: bash scripts/smoke-triage.sh
        env:
          SMOKE_PYTHON: artifacts/playwright/bin/python
