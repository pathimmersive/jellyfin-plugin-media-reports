# A version tag (v1.2.3 or v1.2.3.4) packages the plugin, creates the GitHub Release
# with the zip and its manifest entry, then rebuilds manifest.json on GitHub Pages.
# A release that already exists is never replaced: a fix ships as a new version.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The checkout holds the tag without its message; fetch it for the changelog.
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          changelog="$(git tag -l --format='%(contents:subject)' "$TAG")"
          bash scripts/package.sh "$TAG" release \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG" "$changelog"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/media-reports_*.zip release/media-reports_*.json \
            --verify-tag --title "Media Reports $TAG" --notes-from-tag

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
