# Builds and tests every merge request and branch. A version tag (v1.2.3 or v1.2.3.4)
# packages the plugin, uploads the zip and its manifest entry to the Generic Package
# Registry, creates a GitLab Release, and rebuilds manifest.json on GitLab Pages from
# every Release, so admins can add <pages url>/manifest.json as a plugin repository.

stages:
  - test
  - package
  - release
  - pages

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/media-reports"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.dotnet:
  image: mcr.microsoft.com/dotnet/sdk:10.0

.release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\.\d+)?$/

test:
  extends: .dotnet
  stage: test
  script:
    - dotnet build -c Release
    - dotnet test -c Release --no-build
    - bash scripts/check-repo-docs.sh

package:
  extends: [.dotnet, .release-tag]
  stage: package
  script:
    - bash scripts/package.sh "$CI_COMMIT_TAG" release "$PACKAGE_REGISTRY_URL/$CI_COMMIT_TAG" "$CI_COMMIT_TAG_MESSAGE"
    - |
      for file in release/media-reports_*.zip release/media-reports_*.json; do
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "$PACKAGE_REGISTRY_URL/$CI_COMMIT_TAG/$(basename "$file")"
      done
    - zip_name="$(basename release/media-reports_*.zip)"
    - echo "ZIP_NAME=$zip_name" >> release.env
    - echo "ENTRY_NAME=${zip_name%.zip}.json" >> release.env
  artifacts:
    paths:
      - release/media-reports_*
    reports:
      dotenv: release.env

release:
  extends: .release-tag
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [package]
  script:
    - echo "Creating the $CI_COMMIT_TAG release"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Media Reports $CI_COMMIT_TAG
    description: Media Reports $CI_COMMIT_TAG
    assets:
      links:
        - name: $ZIP_NAME
          url: $PACKAGE_REGISTRY_URL/$CI_COMMIT_TAG/$ZIP_NAME
          link_type: package
        - name: $ENTRY_NAME
          url: $PACKAGE_REGISTRY_URL/$CI_COMMIT_TAG/$ENTRY_NAME
          link_type: other

pages:
  extends: .dotnet
  stage: pages
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\.\d+)?$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - bash scripts/build-manifest.sh public/manifest.json --gitlab
  artifacts:
    paths:
      - public
